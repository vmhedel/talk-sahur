<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b1d12">
    <title>Tung Tung Sahur</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="chat" aria-label="Chat">
        <div id="chat-status" class="status" role="status" aria-live="polite">
          Aguardando alguém
        </div>
        <form id="message-form" class="message-form">
          <input
            id="name-input"
            name="name"
            type="text"
            maxlength="24"
            aria-label="Seu nome"
            placeholder="Seu nome"
            autocomplete="nickname"
            required
          >
          <div class="message-compose">
            <input
              id="message-input"
              name="message"
              type="text"
              maxlength="500"
              aria-label="Mensagem"
              placeholder="Manda uma mensagem..."
              autocomplete="off"
              required
            >
            <button id="send-button" type="submit" disabled>Enviar</button>
          </div>
        </form>
        <div
          id="messages"
          class="messages"
          role="log"
          aria-live="polite"
          aria-relevant="additions"
        ></div>
        <noscript>
          <p class="status">Ative o JavaScript</p>
        </noscript>
      </section>
    </main>
    <footer class="app-version" aria-label="Versão">v1.0.1</footer>
  </body>
</html>
